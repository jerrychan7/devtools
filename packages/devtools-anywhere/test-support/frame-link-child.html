<!doctype html>
<html>
  <head>
    <title>frame link child</title>
    <script>
      // The probe, with its own panel, and data-parent-origins and data-frame-origins from the query
      // (`parentOrigins`, `frameOrigins`).
      const query = new URLSearchParams(location.search);
      const origins = query.get('parentOrigins');
      const frameOrigins = query.get('frameOrigins');
      document.write(
        '<script src="/packages/devtools-anywhere/dist-test/probe.iife.js"' +
          ' data-devtools-frontend-url="/tests/e2e/frontends/fake-frontend.html"' +
          (origins === null ? '' : ` data-parent-origins="${origins}"`) +
          (frameOrigins === null ? '' : ` data-frame-origins="${frameOrigins}"`) +
          '></' +
          'script>'
      );
    </script>
  </head>
  <body style="margin: 0">
    <p id="target">child page</p>
    <script>
      // An iframe of its own, whose URL is in the query (`grandchild`).
      if (query.get('grandchild')) {
        const grandchild = document.createElement('iframe');
        grandchild.id = 'grandchild';
        grandchild.style.cssText = 'width: 200px; height: 100px; border: 0';
        grandchild.src = query.get('grandchild');
        document.body.append(grandchild);
      }
      window.marker = 'child of ' + location.origin;
      console.log('child loaded', location.origin);
    </script>
  </body>
</html>
