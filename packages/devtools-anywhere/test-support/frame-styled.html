<!doctype html>
<html>
  <head>
    <title>frame styled</title>
    <link rel="stylesheet" href="assets/frame.css" />
    <style>
      #inner {
        color: rgb(1, 2, 3);
        padding: 2px;
      }
      /* The iframe is narrow: this holds in it, not in the top page. */
      @media (max-width: 400px) {
        .narrow {
          margin-left: 7px;
        }
      }
      .holder {
        container: holder / inline-size;
      }
      @container holder (max-width: 400px) {
        .narrow {
          margin-right: 5px;
        }
      }
      #inner:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="holder" style="background-color: rgba(0, 0, 200, 0.5)">
      <p id="inner" class="narrow" style="font-weight: 700">inner text</p>
    </div>
  </body>
</html>
