<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="/playground/manifest.json" />
    <title>devtools-anywhere playground</title>
    <!-- The probe must be the first synchronous script. -->
    <script src="/packages/cdp-server/dist/probe.iife.js"></script>
    <script src="/experiments/early-capture/scenario-early.js"></script>
    <script src="/experiments/early-capture/scenario-throw.js"></script>
  </head>
  <body>
    <h1>devtools-anywhere playground</h1>
    <p>
      Early output is captured by the probe; <code>&lt;devtools-anywhere&gt;</code> loads 1s after <code>load</code>.
      Tap the F12 button to open DevTools.
    </p>
    <script>
      console.log('[body] end of body');
    </script>
    <script src="/playground/seed.js"></script>
    <script src="/playground/lexical.js"></script>
    <form toolname="search_echo" tooldescription="Searches the echo API." toolautosubmit action="/api/echo">
      <input name="q" placeholder="Query" required />
      <button>Search</button>
    </form>
    <script src="/playground/webmcp.js"></script>
    <!-- Transformed boxes: inspect them to see the highlight follow the rotation. -->
    <div style="display: flex; gap: 48px; margin: 48px 24px">
      <div id="rotated-block" style="width: 120px; height: 60px; background: #fdd; transform: rotate(30deg)">
        block 30°
      </div>
      <div style="width: 160px; transform: rotate(30deg)">
        <span id="inline-30" style="background: #dfd; padding: 4px; border: 2px solid green"
          >a multi-line inline element rotated 30 degrees</span
        >
      </div>
      <div style="width: 160px; transform: rotate(45deg)">
        <span id="inline-45" style="background: #ddf; padding: 4px; border: 2px solid blue"
          >a multi-line inline element rotated 45 degrees</span
        >
      </div>
      <div id="scroller" style="width: 150px; height: 80px; overflow: auto; border: 1px solid #999">
        <div style="width: 120px; transform: rotate(45deg); margin: 40px 10px">
          <span id="inline-45-scrolled" style="background: #ffd; padding: 4px"
            >inline at 45 degrees in a scroll box</span
          >
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('load', function () {
        console.log('[body] load');
        setTimeout(function () {
          var s = document.createElement('script');
          s.src = '/packages/devtools-anywhere/dist/devtools-anywhere.iife.js';
          s.onload = function () {
            var devtools = document.createElement('devtools-anywhere');
            devtools.setAttribute('frontend', '/packages/devtools-frontend/dist/anywhere_app.html');
            if (location.hash === '#open') devtools.setAttribute('open', '');
            document.body.appendChild(devtools);
            setTimeout(function () {
              console.log('[late] after attach', { late: true });
              fetch('/api/echo?n=fetch-late');
            }, 3000);
          };
          document.head.appendChild(s);
        }, 1000);
      });
    </script>
  </body>
</html>
