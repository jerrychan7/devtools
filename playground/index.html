<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>devtools-anywhere playground</title>
  <!-- The probe must be the first synchronous script. -->
  <script src="/packages/cdp-server/dist/probe.iife.js"></script>
  <script src="/experiments/early-capture/scenario-early.js"></script>
  <script src="/experiments/early-capture/scenario-throw.js"></script>
  <script src="./bridge.js"></script>
</head>
<body>
  <h1>devtools-anywhere playground</h1>
  <p>Early output is captured by the probe; the CDP server and DevTools load 1s after <code>load</code>.</p>
  <script>
    console.log('[body] end of body')
    window.addEventListener('load', function () {
      console.log('[body] load')
      setTimeout(function () {
        var s = document.createElement('script')
        s.src = '/packages/cdp-server/dist/cdp-server.iife.js'
        s.onload = function () {
          window.attachDevtools()
          setTimeout(function () {
            console.log('[late] after attach', { late: true })
            fetch('/api/echo?n=fetch-late')
          }, 3000)
        }
        document.head.appendChild(s)
      }, 1000)
    })
  </script>
</body>
</html>
