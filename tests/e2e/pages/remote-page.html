<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The remote server's port is only known at run time: `?remote=<its URL>`, `&idInQuery` for
         its id-in-query form, and `&panel` for DevTools in the page too. -->
    <script>
      const query = new URLSearchParams(location.search);
      document.write(
        '<script src="' +
          query.get('remote') +
          'probe.iife.js" data-remote' +
          (query.has('idInQuery') ? ' data-id-in-query' : '') +
          (query.has('panel')
            ? ' data-devtools-frontend-url="' +
              location.origin +
              '/tests/e2e/frontends/fake-frontend.html" data-default-shell-mode="off" data-open-immediately'
            : '') +
          '><\/script>'
      );
    </script>
    <title>remote page</title>
    <script>
      console.log('remote early', performance.timeOrigin);
    </script>
  </head>
  <body>
    <h1 id="remote-marker">hello</h1>
  </body>
</html>
