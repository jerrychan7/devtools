<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The remote server's port is only known at run time: `?remote=<its URL>`, and `&single` for
         its single-path form. -->
    <script>
      const query = new URLSearchParams(location.search);
      document.write(
        '<script src="' +
          query.get('remote') +
          'probe.iife.js" data-remote' +
          (query.has('single') ? ' data-single-path' : '') +
          '><\/script>'
      );
    </script>
    <title>remote page</title>
    <script>
      console.log('remote early', performance.timeOrigin);
    </script>
  </head>
  <body>
    <h1 id="remote-marker">hello</h1>
  </body>
</html>
