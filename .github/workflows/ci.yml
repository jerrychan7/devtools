# Checks every push to main and every pull request: lint, types, the DevTools frontend built from
# source at the pinned REVISION, and all tests against Chrome for Testing at the version the
# frontend comes from (the packages' "chrome" field).
#
# Caches (actions/cache: a key that misses is saved at the end of the job; a hit is not saved
# again):
# - depot_tools, bootstrapped: not keyed on anything, as the build pins nothing in it and keeps it
#   from updating itself (DEPOT_TOOLS_UPDATE=0). Bump the key's version to take a newer one.
# - The devtools-frontend checkout with its build output, keyed on REVISION: a hit rebuilds only
#   what changed, and a new REVISION starts from the last checkout (restore-keys), so the sync
#   fetches only what moved.
# - Chrome for Testing, keyed on its version.
# - pnpm's store, keyed on the lockfile (setup-node).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run moot; every commit on main keeps its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # No git hooks on a runner: nothing is committed there.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm fmt:check
          pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Disk usage before the frontend
        run: df -h /

      - name: Restore depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools.ignore
          key: depot-tools-${{ runner.os }}-v1

      - name: Fetch depot_tools
        run: |
          [ -d depot_tools.ignore ] ||
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools.ignore

      - name: Restore the devtools-frontend checkout
        uses: actions/cache@v4
        with:
          path: devtools-frontend.ignore
          key: devtools-frontend-${{ runner.os }}-${{ hashFiles('packages/devtools-frontend/REVISION') }}
          restore-keys: devtools-frontend-${{ runner.os }}-

      - name: Build the DevTools frontend
        run: pnpm --filter @devtools-anywhere/devtools-frontend build:frontend

      - name: Disk usage after the frontend
        run: |
          df -h /
          du -sh depot_tools.ignore devtools-frontend.ignore devtools-frontend.ignore/devtools-frontend/.git \
            devtools-frontend.ignore/devtools-frontend/out packages/devtools-frontend/dist \
            packages/devtools-frontend-locales/dist "$(pnpm store path)" 2>/dev/null || true

      - name: Chrome version
        id: chrome
        run: echo "version=$(node -p "require('./packages/devtools-frontend/package.json').chrome")" >> "$GITHUB_OUTPUT"

      - name: Restore Chrome for Testing
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ steps.chrome.outputs.version }}

      - name: Install Chrome for Testing
        run: |
          # Already there after a cache hit: install only prints its path.
          chrome=$(pnpm dlx @puppeteer/browsers@2 install "chrome@${{ steps.chrome.outputs.version }}" --path ~/.cache/chrome-for-testing | tail -n1 | cut -d' ' -f2-)
          test -x "$chrome"
          "$chrome" --version
          du -sh ~/.cache/chrome-for-testing
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Let Chrome's sandbox run
        # Ubuntu 24.04 keeps unprivileged user namespaces, which the sandbox needs, from Chrome for Testing
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        # Each test file drives its own Chrome: two at a time, as locally, rather than pnpm test's four
        run: node --test --test-concurrency=2 "tests/**/*.test.ts" "packages/*/src/**/*.test.ts" "playground/**/*.test.ts"
